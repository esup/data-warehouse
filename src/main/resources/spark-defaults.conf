# Spark Application Configuration
spark.app.name=dp-spark-job
spark.master=yarn
spark.deploy.mode=cluster

# History Server Configuration
spark.yarn.historyServer.address=p-bdm-app01:18080
spark.history.ui.port=18080

# Event Log Configuration
spark.eventLog.enabled=true
spark.eventLog.dir=hdfs://p-bdm-app02:8020/tmp/spark/history

# Iceberg Dependencies
spark.jars.packages=org.apache.iceberg:iceberg-spark-runtime-3.3_2.12:1.6.1,org.apache.iceberg:iceberg-hive-runtime:1.6.1

# Catalog Configuration for Iceberg
spark.sql.catalog.spark_catalog=org.apache.iceberg.spark.SparkSessionCatalog
spark.sql.catalog.spark_catalog.type=hive
spark.sql.catalog.spark_catalog.uri=thrift://p-bdm-app03:9083
spark.sql.catalog.spark_catalog.warehouse=hdfs://p-bdm-app02:8020/user/hive/warehouse

# Iceberg Extensions
spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Session Configuration
spark.sql.session.timeZone=Asia/Shanghai
